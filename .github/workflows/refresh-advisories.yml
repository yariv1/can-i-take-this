name: Refresh travel advisories

# Re-reads the official US, UK and Canada advisory feeds every 6 hours and commits advisories.json, level4.json and mexico.json when something changed
# (or at least once a day, so the "checked" time on the page stays recent). Only those data files are touched.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-advisories
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node update_advisories.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- advisories.json level4.json mexico.json; then
            echo "advisory data unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add advisories.json level4.json mexico.json
          git commit -m "Refresh travel advisories data"
          git pull --rebase origin main
          git push origin main
