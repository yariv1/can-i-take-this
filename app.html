*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,var(--glow) 0%,transparent 60%),var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
.wrap{max-width:440px;margin:0 auto;padding:20px 18px 64px}

.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;flex:none;background:var(--mark-bg);display:grid;place-items:center;color:#EDF0F7;box-shadow:0 6px 18px rgba(0,0,0,.22)}

.combo{position:relative}

.combo-trigger{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:24px 30px 9px 12px;min-height:57px;height:100%;display:flex;align-items:center;gap:9px;cursor:pointer;transition:border-color .15s}
.combo-trigger:hover{border-color:var(--surface-2)}
.combo-trigger .name{font-weight:600;font-size:14px;line-height:1.16;white-space:normal;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.opt:hover{background:var(--surface-2)}
.opt .iata{margin-left:auto;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)}

.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}

.bag2 button{background:var(--surface);border:1px solid var(--line);border-radius:13px;color:var(--text);cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;padding:13px 12px;text-align:left;transition:.15s;line-height:1.22;height:100%;display:flex;flex-direction:column;justify-content:flex-start}

.bagsolo{width:100%;margin-top:9px;background:var(--surface);border:1px solid var(--line);border-radius:13px;color:var(--text);cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;padding:13px 14px;text-align:left;transition:.15s;line-height:1.22;display:block}
.bagsolo small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:3px}
.bagsolo.on{border-color:var(--sel-bg);box-shadow:inset 0 0 0 1px var(--sel-bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;color:var(--text);cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;font-size:13.5px;padding:9px 14px;transition:.14s;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--surface-2)}

.chip.on{background:var(--sel-bg);color:var(--sel-text);border-color:var(--sel-bg);font-weight:600}
.chip.sm{font-family:'Space Mono',monospace;font-size:12.5px;font-weight:700;padding:8px 13px}
.chip.fare{font-size:12.5px}
#itemQuick,#dogSize{margin-bottom:9px}

.searchrow{display:flex;gap:8px}
.tinput{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;padding:13px 14px}

.pickwrap{position:relative}
@media(max-width:640px){
.pickwrap .suggest{position:absolute;left:0;right:0;bottom:100%;margin:0 0 8px;max-height:46vh;overflow:auto;z-index:60;box-shadow:0 -10px 28px rgba(0,0,0,.4)}
.pickwrap .suggest:empty{display:none}
}
.suggest:empty{display:none}

.strip{padding:15px 18px;display:flex;align-items:center;gap:12px;color:#08111f}

/* ============ rules ============ */
function R(status,head,lines,src){return {status:status,head:head,lines:lines,src:src};}
function verdict(){
  var mode=S.mode,bag=S.bag,cat=S.cat,detail=S.detail,airline=S.airline,country=S.country,carry=bag==='carry';
  var src=mode==='plane'?'Based on standard IATA & aviation-security rules. Always confirm the exact limit with '+airline+' before you fly.':'Import rules change often and vary by nationality. Confirm with the '+country+' customs authority or your embassy before you travel.';
  if(mode==='plane'){
    if(cat==='liquids'||cat==='perfume'||cat==='alcohol'){
      var ml=detail?parseInt(detail,10):null;
      if(!carry)return R('go','Fine in your checked bag.',['No 100 ml limit applies to checked bags.',cat==='alcohol'?'Alcohol over 70% ABV is banned; 24-70% is capped at 5 L per person.':'Pack it well - pressure changes can cause leaks.'],src);
      if(ml===null)return R('warn','Depends on the size - pick one above.',['In carry-on, each container must be 100 ml or less.'],src);
      if(ml<=100)return R('go','Yes - carry it on.',[ml+' ml is within the 100 ml carry-on limit.','Keep it with your other liquids in one clear resealable bag.',cat==='alcohol'?'Sealed duty-free bought after security is also allowed.':''].filter(Boolean),src);
      return R('stop','Not in your carry-on.',[(detail==='500'?'500 ml or more':ml+' ml')+' is over the 100 ml cabin limit.','Move it to your checked bag - there it is allowed.'],src);
    }
    if(cat==='power'){
      if(!carry)return R('stop','No - never in checked baggage.',['Spare lithium batteries and power banks are banned from the hold.','They must travel in the cabin, with you.'],src);
      if(detail==='hi')return R('stop','Not allowed on board.',['Over 160 Wh is prohibited on passenger flights entirely.'],src);
      if(detail==='mid')return R('warn','Yes - with airline approval.',['100-160 Wh is allowed in carry-on, but needs '+airline+' prior approval.','Limit of two.'],src);
      return R('go','Yes - in your carry-on.',['Under 100 Wh (most phone/laptop power banks) is fine in the cabin.','Keep terminals protected; do not charge devices during taxi/takeoff.'],src);
    }
    if(cat==='vape')return carry?R('warn','Cabin only - carry it on.',['E-cigarettes and vapes must be in the cabin, never checked.','Do not use or charge them on board.'],src):R('stop','No - never in the hold.',['Vapes and e-cigarettes are banned from checked baggage for fire safety.'],src);
    if(cat==='lighter')return R('warn','One on you - not in bags.',['One lighter is allowed on your person, not in carry-on or checked bags.','Torch/jet lighters are usually banned entirely.'],src);
  }
  if(mode==='country'){
    if(cat==='alcohol')return country==='United Arab Emirates'?R('warn','Tight limits - respect the local law.',['The UAE permits a small duty-free allowance for non-Muslim adults; know the current litre limit and behave accordingly.'],src):R('warn','Within your duty-free allowance.',['Adults may bring a set duty-free amount (often ~1 L spirits or a few L of wine).','Over the allowance, you pay duty at customs.'],src);
    if(cat==='cash')return R('warn','Allowed - but you must declare large sums.',['Carrying cash is legal, but amounts over the threshold must be declared.','Typical limits: US $10,000 / EU EUR 10,000 (or equivalent).','Not declaring can mean seizure and fines.'],src);
    if(cat==='plants')return R('warn','High-risk - usually needs a permit.',['Live plants, seeds, soil and cuttings are tightly controlled for biosecurity.','Most require a phytosanitary certificate or are banned outright.','Declare on arrival without exception.'],src);
    if(cat==='vape')return country==='Thailand'?R('stop','Illegal - leave it at home.',['Thailand bans importing e-cigarettes and vapes; penalties include fines and jail.'],src):R('warn','Often restricted - check first.',['Some countries ban or heavily restrict vapes and nicotine liquids.','Where allowed, small personal quantities are typical.'],src);
    if(cat==='tobacco')return R('warn','Within your duty-free allowance.',['Adults may bring a set amount duty-free (often ~200 cigarettes).','Above that you pay duty; some countries require a health-warning-compliant pack.'],src);
  }
  return null;
}
/* ---- medicine ---- */
function medCountryVerdict(entry){
  var ing=entry.ing,country=S.country,rules=MED_RULES[ing];
  var level=rules?(rules[country]||rules.def):'unknown';
  var auth=MED_AUTH[country]||{label:country+' health & customs authority',url:null};
  var ingTag={t:'Active ingredient \u00B7 '+ing,k:'neutral'};
  var base={source:auth,src:'Medication rules vary by country and can change. This is guidance, not legal advice - carry your prescription and confirm with the official authority before you fly.'};
  if(level==='ban')return merge(base,{status:'stop',tags:[ingTag,{t:'Not permitted',k:'stop'}],head:entry.n+' contains '+ing+' \u2014 banned in '+country+'.',lines:['A prescription does not change this - '+ing+' is prohibited in '+country+'.','Do not pack it. Ask your doctor about an approved alternative for the trip.']});
  if(level==='permit')return merge(base,{status:'warn',tags:[ingTag,{t:'Prescription + prior approval',k:'amber'}],head:'Allowed only if you arrange approval first.',lines:[ing+' is controlled in '+country+' - you need an import permit or advance approval before you travel.','Apply ahead of time and carry the approval together with your prescription.']});
  if(level==='rx')return merge(base,{status:'go',tags:[ingTag,{t:'Prescription needed',k:'amber'}],head:'Yes - bring it with your prescription.',lines:['Carry '+entry.n+' in its original packaging with the prescription or a doctor letter.','Bring only a personal supply (usually up to ~30-90 days).']});
  if(level==='ok')return merge(base,{status:'go',tags:[ingTag,{t:'No prescription needed',k:'green'}],head:'Yes - you can bring this in.',lines:[ing+' is not specially restricted in '+country+'.','Keep it in original packaging and bring a reasonable personal supply.']});
  return merge(base,{status:'info',tags:[ingTag],head:'We don\'t have verified info for this yet.',lines:['We can\'t confirm how '+country+' treats '+ing+', so we won\'t guess.','See Helpful sources below and carry your prescription.']});
}
function medPlaneVerdict(entry){
  var ing=entry.ing,country=S.country;
  var lines=['Keep '+entry.n+' in your hand luggage in its original packaging, with the prescription or a doctor note.'];
  if(entry.liquid)lines.push('As a liquid medicine it is exempt from the 100 ml cabin rule — just declare it at security.');
  if(entry.injectable)lines.push('Needles and syringes are allowed with the medication — carry the prescription to show at security.');
  if(entry.controlled)lines.push(ing+' is a controlled substance in many places — carry documentation, and the destination rule matters most (below).');
  lines.push('Flying with it is fine — the real question is whether '+country+' lets '+ing+' in.');
  return {status:'go',tags:[{t:'Active ingredient \u00B7 '+ing,k:'neutral'},{t:'Cabin only',k:'amber'}],head:'Yes — carry '+entry.n+' in the cabin.',lines:lines,source:airSource(),src:'Based on aviation-security rules. Keep medication with you in the cabin, never in the hold.'};
}
/* ---- food ---- */
function foodCountryVerdict(entry){
  var c=entry.c,country=S.country,rules=FOOD_RULES[country]||FOOD_RULES.def,level=rules[c]||rules.def,cn=CATNAME[c]||'Food';
  var catTag={t:'Category \u00B7 '+cn,k:'neutral'};
  var base={source:{label:country+' customs / biosecurity authority',url:null},src:'Food rules protect against pests and disease. When unsure, always declare it - declaring is free, smuggling is fined.'};
  if(level==='go')return merge(base,{status:'go',tags:[catTag,{t:'Generally accepted',k:'green'}],head:entry.n+' is usually fine to bring in.',lines:['Sealed, commercially packaged '+cn.toLowerCase()+' is generally accepted.','Still tick the "food" box on your arrival card if there is one.']});
  if(level==='stop')return merge(base,{status:'stop',tags:[catTag,{t:'Not permitted',k:'stop'}],head:'Leave the '+entry.n.toLowerCase()+' behind — '+country+' won\'t allow it.',lines:[cn+' is prohibited or destroyed on arrival in '+country+'.','Undeclared risks a fine; declared, it will simply be taken.']});
  if(level==='warn')return merge(base,{status:'warn',tags:[catTag,{t:'Declare on arrival',k:'amber'}],head:entry.n+' is restricted — declare it.',lines:[cn+' is limited in '+country+' and may be inspected or refused.','Declare it on arrival; sealed commercial products have the best chance.']});
  return merge(base,{status:'info',tags:[catTag],head:'We\'re not sure about '+entry.n+'.',lines:['We can\'t confirm how '+country+' treats this item.','Declare it to be safe and see Helpful sources below.']});
}
function foodPlaneVerdict(entry){
  var country=S.country,liquid=(entry.form==='liquid'),carry=S.bag==='carry';
  var lines=[];
  if(liquid&&carry){lines.push(entry.n+' counts as a liquid/gel — in carry-on it must be 100 ml or less.');lines.push('Baby food and baby formula are exempt in reasonable amounts — just declare them.');}
  else if(liquid){lines.push(entry.n+' is a liquid/gel but there is no 100 ml limit in checked bags.');}
  else{lines.push('As a solid food, '+entry.n+' is fine in both the cabin and checked bags.');}
  lines.push('The real question is whether '+country+' lets '+entry.n.toLowerCase()+' in — check that below.');
  return {status:(liquid&&carry)?'warn':'go',tags:[{t:'Food \u00B7 '+entry.n,k:'neutral'}],head:(liquid&&carry)?('Keep '+entry.n+' to 100 ml in the cabin'):('Yes — '+entry.n+' is fine to fly with'),lines:lines,source:airSource(),src:'Based on aviation-security rules for food in the cabin and hold.'};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shortUrl(u){try{return u.replace(/^https?:\/\//,'').replace(/\/$/,'').slice(0,44);}catch(e){return u;}}
function currentLabel(){return S.mode==='plane'?S.airline:S.country;}
function currentThing(){
  if(isStandalone())return S.item?S.item.n:'this item';
  if(isAnimal()){var t=S.animal||'animal';if(S.animal==='Dog'&&S.dogSize)t=S.dogSize+' dog';return t;}
  if(isItemMode()&&S.item)return S.item.n;
  var d='';var arr=CATS[S.mode];for(var i=0;i<arr.length;i++)if(arr[i].id===S.cat){d=arr[i].label;break;}
  if(S.detail){if(S.cat==='power')d+=' '+({lo:'under 100 Wh',mid:'100-160 Wh',hi:'over 160 Wh'}[S.detail]||'');else d+=' '+S.detail+' ml';}
  return d||'this item';
}
function buildQuestion(){
  if(isStandalone())return 'Can I check in "'+currentThing()+'" as its own standalone / oversized piece of baggage on a "'+S.airline+'" flight? Give the airline policy: accepted or not, size and weight limits, packing or boxing requirements, and the typical oversized / special-baggage fee.';
  var thing=currentThing();
  if(S.mode==='plane'){
    if(S.cat==='baginfo'){var a=airlineByName(S.airline);var which=S.bag==='carry'?'carry-on / hand baggage':'checked baggage';return 'For the airline "'+a.name+'" (IATA '+a.iata+'), what is the '+which+' allowance PER PASSENGER, for economy and for business class? Give concrete kg, size and piece limits. Note it varies by fare/route.';}
    return 'On a "'+S.airline+'" flight, can I bring '+thing+' in my '+(S.bag==='carry'?'carry-on / cabin bag':'checked bag / hold')+'? Give the specific airline and aviation-security rule, with any limits or conditions.';
  }
  return 'As an arriving traveler, can I bring '+thing+' into '+S.country+'? Give the specific customs / import / biosecurity rule, including limits, permits, declarations or bans.';
}
var LIVE_SYS='You are the answer engine for a "can I take this?" travel app. Use web search to find the CURRENT, SPECIFIC answer for the exact airline/country/item asked. Your FINAL message must be ONLY a single JSON object — no markdown, no code fences, no prose before or after — in this exact shape: {"status":"go|warn|stop|info","head":"one short verdict sentence","lines":["1 to 3 short factual reasons or conditions"],"tags":[{"t":"short label","k":"neutral|green|amber|stop"}],"sources":[{"label":"site or authority name","url":"real https url you used"}]}. status meaning: go=clearly allowed, warn=allowed with conditions/limits/approval, stop=not allowed, info=genuinely unclear. For medicines or live animals into a country be cautious: prefer warn or info and point to the official authority; never a careless yes. Keep each line under ~20 words. Always give 1-3 real sources with working https URLs.';

function liveCard(wrap,fallbackFn,attempt){
  attempt=attempt||0;
  var q=buildQuestion(),label=currentLabel();
  var hit=cacheGet(q);if(hit){renderLive(hit,wrap,false);return;}
  var token=++S.liveToken;
  renderSpin(wrap,label);
  fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,system:LIVE_SYS,messages:[{role:"user",content:q}],tools:[{type:"web_search_20250305",name:"web_search"}]})})
  .then(function(r){return r.json();})
  .then(function(data){
    if(token!==S.liveToken)return;
    if(data&&data.error)throw new Error(data.error.message||'api error');
    var txt=(data.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n').trim();
    txt=txt.replace(/```json/gi,'').replace(/```/g,'').trim();
    var a=txt.indexOf('{'),b=txt.lastIndexOf('}');
    if(a<0||b<0)throw new Error('no json');
    var obj=JSON.parse(txt.slice(a,b+1));
    if(!obj.head||!obj.status)throw new Error('bad shape');
    cacheSet(q,obj);renderLive(obj,wrap,true);
  })
  .catch(function(){
    if(token!==S.liveToken)return;
    if(attempt<1){liveCard(wrap,fallbackFn,attempt+1);return;}
    (fallbackFn||function(w){renderSpinError(w,label);})(wrap);
  });
}
function renderSpin(wrap,label){
  wrap.innerHTML='<div class="pass info print"><div class="strip" style="background:var(--card-sub);color:var(--card-text)"><div class="badge" style="background:rgba(0,0,0,.14)"><div class="spin"></div></div><div><div class="verdict">Checking live\u2026</div><div class="vsub">'+esc(label)+'</div></div></div><div class="perf"></div><div class="body"><p class="headline" style="opacity:.75">Reading current sources for '+esc(label)+'\u2026</p><ul class="detail"><li>Fetching the real, up-to-date rule with web search.</li></ul></div></div>';
}
function renderSpinError(wrap,label){
  wrap.innerHTML='<div class="pass info print"><div class="strip"><div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+VICON.info+'</svg></div><div><div class="verdict">No answer yet</div><div class="vsub">'+esc(label)+'</div></div></div><div class="perf"></div><div class="body"><p class="headline">Couldn\u2019t reach the source just now.</p><ul class="detail"><li>The connection or source didn\u2019t respond. Give it another try.</li></ul><button class="xlink" id="retryLive">Try again</button><div class="src">We won\u2019t show a made-up answer \u2014 only a real, sourced one.</div></div></div>';
  var r=$('#retryLive');if(r)r.onclick=function(){liveCard(wrap);};
}
function renderLive(v,wrap,fresh){
  var route=S.mode==='plane'?'<span>&#9992; <b>'+esc(S.airline)+'</b></span><span>'+bagLabel()+'</span><span>&rarr; <b>'+esc(S.country)+'</b></span>':'<span>&#128706; ENTERING</span><span><b>'+esc(S.country)+'</b> '+(CFLAG[S.country]||'')+'</span>';
  var tags=(v.tags||[]).slice(0,4).map(function(t){var k=({neutral:'neutral',green:'green',amber:'amber',stop:'stop'}[t.k]||'neutral');return '<span class="tag tag-'+k+'">'+esc(t.t)+'</span>';});
  var tagsHtml=tags.length?'<div class="tagrow">'+tags.join('')+'</div>':'';
  var lines=(v.lines||[]).map(function(l){return '<li>'+esc(l)+'</li>';}).join('');
  var srcRows=(v.sources||[]).slice(0,4).map(function(s){return '<a class="hitem" href="'+esc(s.url)+'" target="_blank" rel="noopener"><span class="hi-ic">'+SICON.web+'</span><span class="hi-l">'+esc(s.label)+'<small class="email-addr">'+esc(shortUrl(s.url))+'</small></span><span class="hi-go">\u2197</span></a>';}).join('');
  var help='<div class="help"><div class="help-h">Helpful sources</div>'+(srcRows||'<div class="hnote">No direct source returned.</div>')+'<div class="hnote">To be 100% sure, we always recommend confirming with the official channels.</div></div>';
  var xlink=(S.mode==='plane'&&(S.cat==='med'||S.cat==='food')&&S.item)?'<button class="xlink" id="toCountry">Now check if '+esc(S.country)+' lets '+esc(S.item.n)+' in &rarr;</button>':'';
  var st=(['go','warn','stop','info'].indexOf(v.status)>-1)?v.status:'info';
  wrap.innerHTML='<div class="pass '+st+' print"><div class="strip"><div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+VICON[st]+'</svg></div><div><div class="verdict">'+VLABEL[st]+'</div><div class="vsub">'+(S.mode==='plane'?'On the aircraft':'At the border')+'</div></div></div><div class="perf"></div><div class="body"><div class="route">'+route+'</div>'+tagsHtml+'<p class="headline">'+esc(v.head||'')+'</p><ul class="detail">'+lines+'</ul>'+xlink+help+'<div class="src">Answer generated live from current web sources. Guidance, not legal advice.</div></div></div>';
  var t=$('#toCountry');if(t)t.onclick=function(){S.mode='country';S.detail=null;S.animal=null;S.dogSize=null;S.aniQ='';render();$('#itemInput').value=S.item?S.item.n:'';renderVerdict();};
  bindHelp(wrap);
}

function renderVerdict(){
  var wrap=$('#passWrap'),v;
  /* Standalone / oversized check-in item */
  if(isStandalone()){
    if(!S.item){wrap.innerHTML=emptyHTML('Pick or type the large item you\'re checking in.<br><b>e.g. surfboard, bike, skis.</b>');return;}
    v=itemVerdict(); if(v)renderPass(v,wrap); else liveFallback(wrap); return;
  }
  /* Bag info: verified fares -> instant card */
  if(S.mode==='plane'&&S.cat==='baginfo'){
    renderBagCard(wrap); return;
  }
  /* Animals */
  if(isAnimal()){
    if(!S.animal){wrap.innerHTML=emptyHTML('Pick <b>Dog</b>, <b>Cat</b>, or type another animal.<br>We\'ll check '+(S.mode==='plane'?S.airline:S.country)+'.');return;}
    if(S.mode==='plane'&&S.animal==='Dog'&&!S.dogSize){wrap.innerHTML=emptyHTML('<b>How big is your dog?</b><br>Size decides cabin vs cargo — pick one above.');return;}
    v=animalVerdict(); if(v)renderPass(v,wrap); else liveFallback(wrap); return;
  }
  /* Specific-item categories (medication, food, sharp, sports) */
  if(isItemMode()){
    if(!S.item){wrap.innerHTML=emptyHTML('Pick or type your '+({med:'medicine',food:'food',sharp:'sharp object',sports:'gear'}[S.cat])+' above.<br><b>We\'ll check it for you.</b>');return;}
    v=itemVerdict(); if(v)renderPass(v,wrap); else liveFallback(wrap); return;
  }
  /* Universal plane + country customs categories */
  if(!S.cat){wrap.innerHTML=emptyHTML('Your verdict prints here.<br><b>Pick an item above to check it.</b>');return;}
  var co=null,arr=CATS[S.mode];for(var i=0;i<arr.length;i++){if(arr[i].id===S.cat){co=arr[i];break;}}
  if(co&&co.detail&&!S.detail){wrap.innerHTML=emptyHTML((co.detail==='wh'?'Pick the battery capacity above.':'Pick the size above.')+'<br><b>We\'ll show the exact rule.</b>');return;}
  v=verdict(); if(v)renderPass(v,wrap); else liveFallback(wrap);
}
function liveFallback(wrap){
  wrap.innerHTML='<div class="pass info print"><div class="strip"><div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+VICON.info+'</svg></div><div><div class="verdict">Check the source</div><div class="vsub">'+(S.mode==='plane'?'On the aircraft':'At the border')+'</div></div></div><div class="perf"></div><div class="body"><p class="headline">We don’t have a verified answer for this exact combination yet.</p><ul class="detail"><li>We only show answers we can back with a real rule — we won’t invent one.</li><li>Use the official source below to confirm.</li></ul>'+helpBlock(null)+'<div class="src">We show verified data only. For anything not yet in our data, we hand you the official channel.</div></div></div>';
  bindHelp(wrap);
}
function linkRow(icon,label,sub,url){var inner='<span class="hi-ic">'+SICON[icon]+'</span><span class="hi-l">'+label+(sub?'<small>'+sub+'</small>':'')+'</span>'+(url?'<span class="hi-go">\u2197</span>':'');return url?('<a class="hitem" href="'+url+'" target="_blank" rel="noopener">'+inner+'</a>'):('<div class="hitem">'+inner+'</div>');}
function helpBlock(authority){
  var rows='';
  if(S.mode==='plane'){var a=airlineByName(S.airline),d=a.site;if(d)rows+=linkRow('web',a.name+' website','Baggage & rules','https://www.'+d);}
  else{var au=authority||{};if(au&&au.url)rows+=linkRow('web',au.label,'Official guidance',au.url);}
  if(!rows)rows='<div class="hnote">See the airline\u2019s official website for exact details.</div>';
  return '<div class="help"><div class="help-h">Helpful sources</div>'+rows+'<div class="hnote">To be 100% sure, we always recommend confirming with the official channels.</div></div>';
}
function bindHelp(scope){(scope||document).querySelectorAll('.email-trigger').forEach(function(t){t.onclick=function(ev){ev.stopPropagation();var m=t.nextElementSibling;document.querySelectorAll('.email-menu').forEach(function(x){if(x!==m)x.classList.add('hidden');});if(m&&m.classList.contains('email-menu'))m.classList.toggle('hidden');};});}
function renderPass(v,wrap){
  var route=S.mode==='plane'?'<span>&#9992; <b>'+S.airline+'</b></span><span>'+(S.bag==='carry'?'CARRY-ON':'CHECKED')+'</span><span>&rarr; <b>'+S.country+'</b></span>':'<span>&#128706; ENTERING</span><span><b>'+S.country+'</b> '+(CFLAG[S.country]||'')+'</span>';
  var tagsHtml=(v.tags&&v.tags.length)?'<div class="tagrow">'+v.tags.map(function(t){return '<span class="tag tag-'+t.k+'">'+t.t+'</span>';}).join('')+'</div>':'';
  var xlink=(S.mode==='plane'&&(S.cat==='med'||S.cat==='food')&&S.item&&!S.item.free)?'<button class="xlink" id="toCountry">Now check if '+S.country+' lets '+S.item.n+' in &rarr;</button>':'';
  wrap.innerHTML='<div class="pass '+v.status+' print"><div class="strip"><div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+VICON[v.status]+'</svg></div><div><div class="verdict">'+VLABEL[v.status]+'</div><div class="vsub">'+(S.mode==='plane'?'On the aircraft':'At the border')+'</div></div></div><div class="perf"></div><div class="body"><div class="route">'+route+'</div>'+tagsHtml+'<p class="headline">'+v.head+'</p><ul class="detail">'+v.lines.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul>'+xlink+helpBlock(v.source)+'<div class="src">'+v.src+'</div></div></div>';
  var t=$('#toCountry');if(t)t.onclick=function(){S.mode='country';S.detail=null;S.animal=null;S.dogSize=null;S.aniQ='';render();$('#itemInput').value=S.item?S.item.n:'';renderVerdict();};
  bindHelp(wrap);
}

/* ============ wire up ============ */
$('#themeToggle').onclick=function(){theme=theme==='dark'?'light':'dark';applyTheme();};
$('#airlineTrigger').onclick=function(){S.open==='airline'?(S.open=null,closePanels()):openPanel('airline');};
$('#countryTrigger').onclick=function(){S.open==='country'?(S.open=null,closePanels()):openPanel('country');};
$('#airlineSearch').addEventListener('input',function(e){S.aQ=e.target.value;renderAirlineList();});
$('#countrySearch').addEventListener('input',function(e){S.cQ=e.target.value;renderCountryList();});
document.addEventListener('click',function(e){if(!e.target.closest('.combo')){S.open=null;closePanels();}if(!e.target.closest('.email-trigger')&&!e.target.closest('.email-menu')){document.querySelectorAll('.email-menu').forEach(function(x){x.classList.add('hidden');});}});
document.querySelectorAll('#seg button').forEach(function(b){b.onclick=function(){S.mode=b.dataset.mode;S.cat=S.mode==='plane'?'baginfo':'med';S.detail=null;S.item=null;S.itemQ='';S.animal=null;S.dogSize=null;S.aniQ='';S.fare=0;$('#itemInput').value='';$('#animalInput').value='';$('#itemSuggest').innerHTML='';$('#aniSuggest').innerHTML='';render();};});
document.querySelectorAll('#bag button').forEach(function(b){b.onclick=function(){S.bag=b.dataset.bag;S.item=null;S.itemQ='';$('#itemInput').value='';$('#itemSuggest').innerHTML='';render();};});
$('#bagStandalone').onclick=function(){S.bag='standalone';S.item=null;S.itemQ='';$('#itemInput').value='';$('#itemSuggest').innerHTML='';render();focusPicker();};
$('#itemInput').addEventListener('input',function(e){S.itemQ=e.target.value;if(isStandalone())renderSoloSuggest();else renderItemSuggest();});
document.querySelectorAll('#animalChips .chip').forEach(function(b){b.onclick=function(){S.animal=b.dataset.a;S.dogSize=null;S.aniQ='';$('#animalInput').value='';$('#aniSuggest').innerHTML='';render();};});
document.querySelectorAll('#dogSize .chip').forEach(function(b){b.onclick=function(){S.dogSize=b.dataset.s;render();};});
$('#animalInput').addEventListener('input',function(e){S.aniQ=e.target.value;renderAniSuggest();});
$('#scanBtn').addEventListener('click',function(){var n=$('#scanNote');n.style.display=n.style.display==='block'?'none':'block';});
applyTheme();renderTriggers();render();
</script>
