*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,var(--glow) 0%,transparent 60%),var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
.wrap{max-width:440px;margin:0 auto;padding:20px 18px 64px}

.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;flex:none;background:var(--mark-bg);display:grid;place-items:center;color:#EDF0F7;box-shadow:0 6px 18px rgba(0,0,0,.22)}

.combo{position:relative}

.combo-trigger{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:24px 30px 9px 12px;min-height:57px;height:100%;display:flex;align-items:center;gap:9px;cursor:pointer;transition:border-color .15s}
.combo-trigger:hover{border-color:var(--surface-2)}
.combo-trigger .name{font-weight:600;font-size:14px;line-height:1.16;white-space:normal;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.opt:hover{background:var(--surface-2)}
.opt .iata{margin-left:auto;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)}

.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}

.bag2 button{background:var(--surface);border:1px solid var(--line);border-radius:13px;color:var(--text);cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;padding:13px 12px;text-align:left;transition:.15s;line-height:1.22;height:100%;display:flex;flex-direction:column;justify-content:flex-start}

.bagsolo{width:100%;margin-top:9px;background:var(--surface);border:1px solid var(--line);border-radius:13px;color:var(--text);cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;padding:13px 14px;text-align:left;transition:.15s;line-height:1.22;display:block}
.bagsolo small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:3px}
.bagsolo.on{border-color:var(--sel-bg);box-shadow:inset 0 0 0 1px var(--sel-bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;color:var(--text);cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;font-size:13.5px;padding:9px 14px;transition:.14s;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--surface-2)}

.chip.on{background:var(--sel-bg);color:var(--sel-text);border-color:var(--sel-bg);font-weight:600}
.chip.sm{font-family:'Space Mono',monospace;font-size:12.5px;font-weight:700;padding:8px 13px}
.chip.fare{font-size:12.5px}
#itemQuick,#dogSize{margin-bottom:9px}

.searchrow{display:flex;gap:8px}
.tinput{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;padding:13px 14px}

.pickwrap{position:relative}
@media(max-width:640px){
.pickwrap .suggest{position:absolute;left:0;right:0;bottom:100%;margin:0 0 8px;max-height:46vh;overflow:auto;z-index:60;box-shadow:0 -10px 28px rgba(0,0,0,.4)}
.pickwrap .suggest:empty{display:none}
}
.suggest:empty{display:none}

.strip{padding:15px 18px;display:flex;align-items:center;gap:12px;color:#08111f}

var LIVE_SYS='You are the answer engine for a "can I take this?" travel app. Use web search to find the CURRENT, SPECIFIC answer for the exact airline/country/item asked. Your FINAL message must be ONLY a single JSON object — no markdown, no code fences, no prose before or after — in this exact shape: {"status":"go|warn|stop|info","head":"one short verdict sentence","lines":["1 to 3 short factual reasons or conditions"],"tags":[{"t":"short label","k":"neutral|green|amber|stop"}],"sources":[{"label":"site or authority name","url":"real https url you used"}]}. status meaning: go=clearly allowed, warn=allowed with conditions/limits/approval, stop=not allowed, info=genuinely unclear. For medicines or live animals into a country be cautious: prefer warn or info and point to the official authority; never a careless yes. Keep each line under ~20 words. Always give 1-3 real sources with working https URLs.';

}

/* ============ wire up ============ */
$('#themeToggle').onclick=function(){theme=theme==='dark'?'light':'dark';applyTheme();};
$('#airlineTrigger').onclick=function(){S.open==='airline'?(S.open=null,closePanels()):openPanel('airline');};
$('#countryTrigger').onclick=function(){S.open==='country'?(S.open=null,closePanels()):openPanel('country');};
$('#airlineSearch').addEventListener('input',function(e){S.aQ=e.target.value;renderAirlineList();});
$('#countrySearch').addEventListener('input',function(e){S.cQ=e.target.value;renderCountryList();});
document.addEventListener('click',function(e){if(!e.target.closest('.combo')){S.open=null;closePanels();}if(!e.target.closest('.email-trigger')&&!e.target.closest('.email-menu')){document.querySelectorAll('.email-menu').forEach(function(x){x.classList.add('hidden');});}});
document.querySelectorAll('#seg button').forEach(function(b){b.onclick=function(){S.mode=b.dataset.mode;S.cat=S.mode==='plane'?'baginfo':'med';S.detail=null;S.item=null;S.itemQ='';S.animal=null;S.dogSize=null;S.aniQ='';S.fare=0;$('#itemInput').value='';$('#animalInput').value='';$('#itemSuggest').innerHTML='';$('#aniSuggest').innerHTML='';render();};});
document.querySelectorAll('#bag button').forEach(function(b){b.onclick=function(){S.bag=b.dataset.bag;S.item=null;S.itemQ='';$('#itemInput').value='';$('#itemSuggest').innerHTML='';render();};});
$('#bagStandalone').onclick=function(){S.bag='standalone';S.item=null;S.itemQ='';$('#itemInput').value='';$('#itemSuggest').innerHTML='';render();focusPicker();};
$('#itemInput').addEventListener('input',function(e){S.itemQ=e.target.value;if(isStandalone())renderSoloSuggest();else renderItemSuggest();});
document.querySelectorAll('#animalChips .chip').forEach(function(b){b.onclick=function(){S.animal=b.dataset.a;S.dogSize=null;S.aniQ='';$('#animalInput').value='';$('#aniSuggest').innerHTML='';render();};});
document.querySelectorAll('#dogSize .chip').forEach(function(b){b.onclick=function(){S.dogSize=b.dataset.s;render();};});
$('#animalInput').addEventListener('input',function(e){S.aniQ=e.target.value;renderAniSuggest();});
$('#scanBtn').addEventListener('click',function(){var n=$('#scanNote');n.style.display=n.style.display==='block'?'none':'block';});
applyTheme();renderTriggers();render();
</script>
